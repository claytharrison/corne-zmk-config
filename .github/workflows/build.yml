name: Build ZMK firmware
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    strategy:
      fail-fast: false
      matrix:
        board: [nice_nano_v2]
        shield: [corne_left, corne_right]
    name: Build ${{ matrix.shield }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Firmware
        uses: zmkfirmware/zmk-build-action@stable
        with:
          board: ${{ matrix.board }}
          shield: ${{ matrix.shield }}
